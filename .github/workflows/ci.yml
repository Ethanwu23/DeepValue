name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: backend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip install --no-deps -e ./backend
      - run: python -m compileall -q backend/src
      - name: 运行后端测试
        run: python -m pytest backend/tests -q
      - name: 校验研究图可加载
        run: python -c "from agent.graph import graph; assert graph.name == 'DeepValue'"
